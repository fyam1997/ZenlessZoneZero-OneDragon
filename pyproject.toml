    "pycparser==2.22",
    "pygetwindow==0.0.9",
    "pyinstaller>=6.7.0",
    "pymsgbox==1.0.9",
    "pynput==1.7.7",
    "pyperclip==1.9.0",
    "pyreadline3==3.4.1",
    "pyrect==0.2.0",
    "pyscreeze==0.1.30",
    "pyside6==6.8.0.2",
    "pyside6-addons==6.8.0.2",
    "pyside6-essentials==6.8.0.2",
    "pyside6-fluent-widgets==1.7.0",
    "pysidesix-frameless-window==0.4.3",
    "pytweening==1.2.0",
    "pywin32==306",
    "pyyaml==6.0.1",
    "requests==2.32.3",
    "scikit-learn==1.5.1",
    "scipy==1.13.1",
    "shapely==2.0.4",
    "shiboken6==6.8.0.2",
